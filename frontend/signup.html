<!DOCTYPE html>
<html lang="en" data-guest-only>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="sig.doctitle">Medic Care | Sign Up</title>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <main class="signup-container">

        <form class="signup-form" id="signupForm" novalidate>

            <h1 data-i18n="sig.h1">Create your account</h1>
            <p class="subtitle" data-i18n="sig.sub">Let's get started!</p>

            <div class="form-group">
                <label for="emailOrPhone" data-i18n="sig.id">Email or Phone Number</label>
                <input type="text" id="emailOrPhone" name="emailOrPhone"
                    placeholder="Enter your email or phone number" data-i18n-ph="sig.id.ph" autocomplete="username">
                <div class="msg" id="idMsg"></div>
            </div>

            <div class="form-group">
                <label for="password" data-i18n="sig.pw">Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Create your password" data-i18n-ph="sig.pw.ph" autocomplete="new-password">
                <div class="msg" id="pwMsg"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" data-i18n="sig.cf">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                    placeholder="Confirm your password" data-i18n-ph="sig.cf.ph" autocomplete="new-password">
                <div class="msg" id="cfMsg"></div>
            </div>

            <button type="submit" class="create-button" data-i18n="sig.btn">Create Account</button>

            <p class="login-link">
                <span data-i18n="sig.have">Already have an account?</span>
                <a href="index.html" data-i18n="sig.login">Log In</a>
            </p>

        </form>

    </main>

    <script src="i18n.js"></script>
    <script src="signup.js"></script>
</body>
</html>
